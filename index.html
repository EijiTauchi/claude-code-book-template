<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブロック崩し</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f72585, #7209b7, #3a86ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #info {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    #info span {
      color: #a0a0c0;
    }

    #info strong {
      color: #fff;
    }

    canvas {
      border: 2px solid #3a86ff;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(58, 134, 255, 0.4);
      display: block;
    }

    #message {
      margin-top: 20px;
      font-size: 1.4rem;
      letter-spacing: 2px;
      height: 32px;
      color: #f72585;
    }

    #startBtn {
      margin-top: 16px;
      padding: 10px 32px;
      font-size: 1rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #f72585, #7209b7);
      color: #fff;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 4px 16px rgba(114, 9, 183, 0.5);
    }

    #startBtn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 24px rgba(114, 9, 183, 0.7);
    }

    #controls {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #6060a0;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="info">
    <div><span>スコア: </span><strong id="scoreDisplay">0</strong></div>
    <div><span>ライフ: </span><strong id="livesDisplay">3</strong></div>
    <div><span>レベル: </span><strong id="levelDisplay">1</strong></div>
  </div>
  <canvas id="gameCanvas" width="480" height="500"></canvas>
  <div id="message"></div>
  <button id="startBtn">スタート</button>
  <div id="controls">← → キーまたはマウスでパドルを操作</div>

  <script src="main.js"></script>
</body>
</html>
